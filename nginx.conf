server {    
    # Root directory for the application
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/xml application/xhtml+xml 
               application/rss+xml application/javascript 
               application/x-javascript application/x-font 
               application/x-font-opentype application/x-font-truetype 
               application/x-font-ttf font/opentype font/ttf 
               image/svg+xml;
    gzip_min_length 1024;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Cache Control for HTML and XML
    location ~* \.(html|xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # SPA routing - rewrite to index.html for non-existent files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
